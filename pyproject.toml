[project]
name = "biotech-venture-catalyst"
version = "0.1.0"
description = "Biotech Venture Catalyst: Predicting Phase 1 Trial Outcomes for Venture Capital Due Diligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.4",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "pytdc>=1.1.15",
    "seaborn>=0.13.2",
    "setuptools<=80.10.2",
]
